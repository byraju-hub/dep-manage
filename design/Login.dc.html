<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position:relative;width:520px;height:640px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#F3F6FF;color:#17202A;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5;padding:24px;overflow:hidden">

  <div aria-hidden="true" style="position:absolute;left:-40px;top:-30px;width:150px;height:150px;border-radius:50%;background:#DAF1FC"></div>
  <div aria-hidden="true" style="position:absolute;left:70px;top:70px;width:46px;height:46px;border-radius:14px;background:#FFE3EE"></div>
  <div aria-hidden="true" style="position:absolute;right:-30px;top:50px;width:120px;height:120px;border-radius:36px;background:#FFEBD0"></div>
  <div aria-hidden="true" style="position:absolute;right:90px;top:18px;width:30px;height:30px;border-radius:50%;background:#DDF5E8"></div>
  <div aria-hidden="true" style="position:absolute;left:-20px;bottom:60px;width:110px;height:110px;border-radius:34px;background:#ECE5FF"></div>
  <div aria-hidden="true" style="position:absolute;left:96px;bottom:24px;width:36px;height:36px;border-radius:50%;background:#FEF3C7"></div>
  <div aria-hidden="true" style="position:absolute;right:-50px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:#D9F5F1"></div>
  <div aria-hidden="true" style="position:absolute;right:110px;bottom:30px;width:44px;height:44px;border-radius:14px;background:#E3ECFF"></div>

  <div style="position:relative;width:100%;max-width:400px;background:#fff;border:1px solid #E1E7F5;border-radius:22px;padding:32px 30px 26px;display:flex;flex-direction:column;gap:20px;box-shadow:0 8px 24px rgba(37,99,235,.10)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
      <div style="width:56px;height:56px;border-radius:16px;background:{{accent}};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px">은</div>
      <div>
        <div style="font-size:21px;font-weight:700;line-height:1.3">은혜교회</div>
        <div style="font-size:13.5px;color:#5B6678">부서 관리 시스템</div>
      </div>
    </div>

    <form style="display:flex;flex-direction:column;gap:14px" onsubmit="return false">
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:700;color:#475467">아이디</span>
        <input type="text" autocomplete="username" style="height:46px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 14px;font-family:inherit;font-size:15px;color:#17202A">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:700;color:#475467">비밀번호</span>
        <input type="password" autocomplete="current-password" style="height:46px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 14px;font-family:inherit;font-size:15px;color:#17202A">
      </label>
      <button type="submit" style="height:48px;border:0;border-radius:12px;background:{{accent}};color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px">로그인</button>
    </form>

    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:6px;border-top:1px solid #EDF1FA">
      <a href="#" style="font-size:14px;font-weight:700;color:{{accent}};padding:6px 8px">초대 코드로 가입하기</a>
      <div style="font-size:12.5px;color:#5B6678;text-align:center;line-height:1.6">가입 후 관리자가 승인하면 사용할 수 있어요.<br>비밀번호를 5번 틀리면 15분 동안 잠겨요.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#0D9488","#7C3AED","#EA580C"]},"$preview":{"width":520,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2563EB' };
  }
}
</script>
</body>
</html>
