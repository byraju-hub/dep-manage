<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>심방</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:1280px;height:960px;box-sizing:border-box;display:flex;background:#F3F6FF;color:#17202A;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5">

  <aside style="width:248px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-right:1px solid #E1E7F5;padding:20px 14px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:10px;padding:0 6px">
      <div style="width:38px;height:38px;border-radius:12px;background:{{accent}};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px">은</div>
      <div>
        <div style="font-size:15px;font-weight:700;line-height:1.2">은혜교회</div>
        <div style="font-size:12px;color:#5B6678">부서 관리</div>
      </div>
    </div>

    <button aria-label="부서 전환" style="display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid #D5DDF0;border-radius:12px;background:#F8FAFF;font-family:inherit;text-align:left;cursor:pointer;color:#17202A">
      <span>
        <span style="display:block;font-size:11px;color:#5B6678;line-height:1.2">부서</span>
        <span style="display:block;font-size:15px;font-weight:600;line-height:1.4">중고등부</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6678" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg>
    </button>

    <nav style="display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{navMain}}" as="item" hint-placeholder-count="5">
        <a href="#" style="{{item.style}}">
          <span style="{{item.tile}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></span>
          <span style="flex-grow:1">{{item.label}}</span>
          <sc-if value="{{item.badge}}" hint-placeholder-val="{{ false }}">
            <span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#E11D48;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center">{{item.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
      <div style="font-size:11.5px;font-weight:600;color:#5B6678;padding:14px 10px 4px;letter-spacing:.02em">계획 · 소통</div>
      <sc-for list="{{navPlan}}" as="item" hint-placeholder-count="4">
        <a href="#" style="{{item.style}}">
          <span style="{{item.tile}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></span>
          <span style="flex-grow:1">{{item.label}}</span>
        </a>
      </sc-for>
    </nav>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
      <a href="#" style="{{settingsStyle}}">
        <span style="{{settingsTile}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></span>
        <span>설정</span>
      </a>
      <div style="display:flex;align-items:center;gap:10px;padding:10px 10px;border-top:1px solid #E1E7F5">
        <div style="width:34px;height:34px;border-radius:50%;background:#FFEBD0;color:#A04A07;display:flex;align-items:center;justify-content:center;font-weight:700">김</div>
        <div style="line-height:1.3">
          <div style="font-size:13.5px;font-weight:600">김선생</div>
          <div style="font-size:12px;color:#5B6678">부장 · 관리자</div>
        </div>
      </div>
    </div>
  </aside>

  <main style="flex-grow:1;min-width:0;box-sizing:border-box;padding:28px 36px;display:flex;flex-direction:column;gap:18px">
    <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px">
      <div>
        <h1 style="margin:0;font-size:24px;font-weight:700;line-height:1.3">심방</h1>
        <div style="font-size:13.5px;color:#5B6678">올해 기록 38건 · 후속 조치 2건 남음</div>
      </div>
      <button style="height:40px;padding:0 18px;border-radius:12px;border:0;background:{{accent}};color:#fff;font-family:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        새 심방 기록
      </button>
    </header>

    <div style="display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start">

      <section aria-label="심방 목록" style="background:#fff;border:1px solid #E1E7F5;border-radius:16px;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
        <sc-for list="{{visits}}" as="v" hint-placeholder-count="6">
          <a href="#" style="{{v.style}}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span style="font-weight:600">{{v.who}}</span>
              <span style="font-size:12.5px;color:#5B6678;flex-shrink:0">{{v.date}}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:11.5px;font-weight:700;border-radius:6px;padding:0 8px;flex-shrink:0;{{v.methodStyle}}">{{v.method}}</span>
              <span style="font-size:13.5px;color:#475467">{{v.title}}</span>
            </div>
            <sc-if value="{{v.followup}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:2px"><span style="font-size:12px;font-weight:600;color:#A04A07;background:#FFEBD0;border-radius:999px;padding:1px 10px">후속 조치 {{v.followup}}</span></div>
            </sc-if>
          </a>
        </sc-for>
      </section>

      <section aria-label="새 심방 기록" style="background:#fff;border:1px solid #E1E7F5;border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;gap:16px">
        <h2 style="margin:0;font-size:18px;font-weight:700">새 심방 기록</h2>

        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-size:13px;font-weight:600;color:#475467">대상</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:#FFE3EE;color:#BE185D;font-weight:700">정하윤 <span style="font-weight:500;font-size:12px;color:#475467">중2</span>
              <button aria-label="정하윤 제거" style="width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:#BE185D;font-size:16px;line-height:1;cursor:pointer">×</button></span>
            <button style="height:34px;padding:0 14px;border-radius:999px;border:1px dashed #98A2B3;background:#fff;color:#475467;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer">+ 학생 · 교사 추가</button>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px">
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:600;color:#475467">날짜</span>
            <input type="text" value="2026. 10. 25" style="height:42px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 12px;font-family:inherit;font-size:14px;color:#17202A">
          </label>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="font-size:13px;font-weight:600;color:#475467">방법</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <sc-for list="{{methods}}" as="m" hint-placeholder-count="6">
                <button style="{{m.style}}">{{m.label}}</button>
              </sc-for>
            </div>
          </div>
        </div>

        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:600;color:#475467">함께한 교사</span>
          <input type="text" value="이상현, 박은지" style="height:42px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 12px;font-family:inherit;font-size:14px;color:#17202A">
        </label>

        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:600;color:#475467">제목</span>
          <input type="text" value="어머니와 진로 상담" style="height:42px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 12px;font-family:inherit;font-size:14px;color:#17202A">
        </label>

        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:600;color:#475467">내용</span>
          <textarea style="height:110px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.6;color:#17202A;resize:none">시험 기간이라 많이 지쳐 있었음. 어머니는 예배 시간에 맞춰 데려다주는 것이 어렵다고 하심. 다음 달에 진로 상담을 이어가기로 함.</textarea>
        </label>

        <div style="display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px">
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:600;color:#475467">후속 조치</span>
            <input type="text" value="진로 상담 일정 잡기" style="height:42px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 12px;font-family:inherit;font-size:14px;color:#17202A">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:600;color:#475467">기한</span>
            <input type="text" value="2026. 10. 30" style="height:42px;box-sizing:border-box;border:1px solid #D5DDF0;border-radius:12px;padding:0 12px;font-family:inherit;font-size:14px;color:#17202A">
          </label>
        </div>

        <fieldset style="margin:0;padding:12px 14px;border:1px solid #FFD9A8;border-radius:14px;background:#FFF8EC;display:flex;flex-direction:column;gap:6px">
          <legend style="padding:0 6px;font-size:13px;font-weight:700;color:#A04A07">누가 볼 수 있나요?</legend>
          <label style="display:flex;align-items:center;gap:10px;min-height:32px"><input type="radio" name="vis" style="accent-color:{{accent}};width:18px;height:18px;margin:0"> 나만 (작성자)</label>
          <label style="display:flex;align-items:center;gap:10px;min-height:32px"><input type="radio" name="vis" checked style="accent-color:{{accent}};width:18px;height:18px;margin:0"> <span><b style="font-weight:600">교역자 · 부장</b> <span style="color:#5B6678;font-size:12.5px">기본값</span></span></label>
          <label style="display:flex;align-items:center;gap:10px;min-height:32px"><input type="radio" name="vis" style="accent-color:{{accent}};width:18px;height:18px;margin:0"> 부서 교사 전체</label>
        </fieldset>

        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button style="height:42px;padding:0 20px;border-radius:12px;border:1px solid #D5DDF0;background:#fff;color:#17202A;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">취소</button>
          <button style="height:42px;padding:0 24px;border-radius:12px;border:0;background:{{accent}};color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">저장</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#0D9488","#7C3AED","#EA580C"]},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2563EB';
    const soft = `color-mix(in srgb, ${accent} 12%, white)`;
    const P = {
      blue: { fg: '#1D4ED8', bg: '#E3ECFF' }, green: { fg: '#0F7B4A', bg: '#DDF5E8' }, violet: { fg: '#6D28D9', bg: '#ECE5FF' },
      sky: { fg: '#0369A1', bg: '#DAF1FC' }, pink: { fg: '#BE185D', bg: '#FFE3EE' }, orange: { fg: '#A04A07', bg: '#FFEBD0' },
      teal: { fg: '#0F766E', bg: '#D9F5F1' }, amber: { fg: '#92400E', bg: '#FEF3C7' }, slate: { fg: '#475467', bg: '#E8ECF3' }
    };
    const tile = (c, s) => `width:${s}px;height:${s}px;border-radius:${Math.round(s * 0.3)}px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${P[c].bg};color:${P[c].fg};`;
    const active = '심방';
    const base = 'display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:12px;font-size:14px;min-height:42px;box-sizing:border-box;';
    const mk = (label, color, d, badge) => ({
      label, d, badge: badge || '', tile: tile(color, 30),
      style: base + (label === active ? `background:${soft};color:#17202A;font-weight:700;` : 'color:#475467;font-weight:500;')
    });
    const M = { '가정': 'green', '전화': 'blue', '문자·카톡': 'amber', '학교': 'violet', '교회': 'teal', '온라인': 'sky', '카페': 'orange' };
    const chip = (label, on) => ({
      label,
      style: 'height:34px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:0;' +
        (on ? `background:${accent};color:#fff;` : 'background:#EEF2FB;color:#475467;')
    });
    const methodPill = (label, on) => {
      const c = P[M[label]];
      return {
        label,
        style: 'height:34px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;' +
          (on ? `border:0;background:${c.fg};color:#fff;` : `border:0;background:${c.bg};color:${c.fg};`)
      };
    };
    const itemBase = 'display:flex;flex-direction:column;gap:3px;padding:11px 10px;border-top:1px solid #EDF1FA;border-radius:12px;';
    const visit = (who, date, method, title, followup, current) => ({
      who, date, method, title, followup: followup || '',
      methodStyle: `background:${P[M[method]].bg};color:${P[M[method]].fg};`,
      style: itemBase + (current ? `background:${soft};` : '')
    });
    return {
      accent, soft,
      settingsStyle: base + 'color:#475467;font-weight:500;',
      settingsTile: tile('slate', 30),
      filters: [chip('전체', true), { label: '후속 조치 남음', style: `height:34px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:0;background:${P.orange.bg};color:${P.orange.fg};` }, chip('내가 쓴 기록', false)],
      methods: ['가정', '전화', '문자·카톡', '학교', '교회', '온라인'].map((l) => methodPill(l, l === '가정')),
      visits: [
        visit('정하윤', '10/24', '가정', '어머니와 진로 상담', '10/30', true),
        visit('윤도현', '10/21', '전화', '시험 기간 안부', '11/2'),
        visit('최민재', '10/18', '문자·카톡', '연속 결석 확인'),
        visit('정시우 외 1명', '10/11', '교회', '새가족 정착 면담'),
        visit('박은지 (교사)', '10/04', '카페', '교사 격려 모임'),
        visit('오세린', '09/27', '가정', '이사 후 안부 방문')
      ],
      navMain: [
        mk('대시보드', 'blue', 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z'),
        mk('학생 명단', 'green', 'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'),
        mk('교사 명단', 'violet', 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'),
        mk('출석 체크', 'sky', 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'),
        mk('심방', 'pink', 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z', '2')
      ],
      navPlan: [
        mk('연간 계획', 'orange', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'),
        mk('사역 계획', 'teal', 'M4 22V4M4 4h13l-2 4 2 4H4'),
        mk('공지사항', 'amber', 'M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6'),
        mk('회의록', 'slate', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8')
      ]
    };
  }
}
</script>
</body>
</html>
