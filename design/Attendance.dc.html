<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>출석 체크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F6FF;color:#17202A;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;overflow:hidden">

  <header style="background:#fff;border-bottom:1px solid #E1E7F5;padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:12px;color:#5B6678;line-height:1.2">은혜교회</div>
        <div style="font-size:18px;font-weight:700;line-height:1.35">출석 체크 · 중고등부</div>
      </div>
      <button aria-label="부서 전환" style="width:44px;height:44px;border-radius:12px;border:1px solid #D5DDF0;background:#F8FAFF;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg>
      </button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:#EEF2FB;border-radius:12px;padding:4px">
      <button aria-label="이전 주" style="width:44px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17202A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div style="font-weight:700;font-size:15px">10월 25일 주일</div>
      <button aria-label="다음 주" style="width:44px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17202A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <div style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </header>

  <section style="padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div style="background:#DDF5E8;border-radius:12px;padding:8px 12px;line-height:1.25">
        <div style="font-size:12.5px;font-weight:600;color:#0F6B40">출석</div>
        <div style="font-size:22px;font-weight:700;color:#0F6B40">{{nPresent}}<span style="font-size:13px;font-weight:600"> 명</span></div>
      </div>
      <div style="background:#ECE5FF;border-radius:12px;padding:8px 12px;line-height:1.25">
        <div style="font-size:12.5px;font-weight:600;color:#5B21B6">온라인</div>
        <div style="font-size:22px;font-weight:700;color:#5B21B6">{{nOnline}}<span style="font-size:13px;font-weight:600"> 명</span></div>
      </div>
      <div style="background:#FFE3EA;border-radius:12px;padding:8px 12px;line-height:1.25">
        <div style="font-size:12.5px;font-weight:600;color:#BE123C">결석</div>
        <div style="font-size:22px;font-weight:700;color:#BE123C">{{nAbsent}}<span style="font-size:13px;font-weight:600"> 명</span></div>
      </div>
    </div>
    <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:#EEF2FB">
      <div style="width:{{wPresent}};background:#0F8A55"></div>
      <div style="width:{{wOnline}};background:#7C3AED"></div>
      <div style="width:{{wAbsent}};background:#E11D48"></div>
    </div>
  </section>

  <section style="flex-grow:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{students}}" as="s" hint-placeholder-count="8">
      <div style="background:#fff;border:1px solid #E1E7F5;border-radius:14px;padding:8px 8px 8px 10px;display:flex;align-items:center;gap:10px;min-height:62px;box-sizing:border-box">
        <div style="{{s.av}}">{{s.initial}}</div>
        <div style="flex-grow:1;min-width:0;line-height:1.35">
          <div style="font-weight:600;font-size:16px;white-space:nowrap">{{s.name}}</div>
          <div style="font-size:12.5px;color:#5B6678;white-space:nowrap">{{s.meta}}</div>
        </div>
        <div role="group" aria-label="{{s.name}} 출석 상태" style="display:flex;gap:2px;background:#EEF2FB;border-radius:12px;padding:3px;flex-shrink:0">
          <button onClick="{{s.setPresent}}" aria-pressed="{{s.isPresent}}" style="{{s.bPresent}}">출석</button>
          <button onClick="{{s.setOnline}}" aria-pressed="{{s.isOnline}}" style="{{s.bOnline}}">온라인</button>
          <button onClick="{{s.setAbsent}}" aria-pressed="{{s.isAbsent}}" style="{{s.bAbsent}}">결석</button>
        </div>
      </div>
    </sc-for>
  </section>

  <div style="padding:10px 16px;background:#fff;border-top:1px solid #E1E7F5">
    <button style="width:100%;height:48px;border:0;border-radius:12px;background:{{accent}};color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer">저장하기</button>
  </div>

  <nav style="display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #E1E7F5;padding:6px 4px 10px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="#" style="{{t.style}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#0D9488","#7C3AED","#EA580C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: { 3: 'absent', 5: 'online', 7: 'online' } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2563EB';
    const roster = [
      ['김', '김하준', '중1 A · 남'], ['박', '박서윤', '중1 A · 여'], ['이', '이도윤', '중1 A · 남'],
      ['최', '최예린', '중1 A · 여'], ['정', '정시우', '새가족 · 남'], ['강', '강지안', '중1 A · 여'],
      ['조', '조민성', '중1 A · 남'], ['윤', '윤하은', '중1 A · 여'], ['장', '장우진', '중1 A · 남'], ['임', '임채원', '중1 A · 여']
    ];
    const avs = [['#E3ECFF', '#1D4ED8'], ['#DDF5E8', '#0F7B4A'], ['#FFEBD0', '#A04A07'], ['#FFE3EE', '#BE185D'], ['#ECE5FF', '#6D28D9'], ['#D9F5F1', '#0F766E']];
    const get = (i) => this.state.status[i] || 'present';
    const set = (i, v) => () => this.setState({ status: { ...this.state.status, [i]: v } });
    const seg = (on, bg) => 'width:50px;height:40px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;' +
      (on ? `border:0;background:${bg};color:#fff;` : 'border:0;background:transparent;color:#475467;');
    const students = roster.map(([initial, name, meta], i) => {
      const st = get(i);
      const [bg, fg] = avs[i % avs.length];
      return {
        initial, name, meta,
        av: `width:40px;height:40px;border-radius:50%;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;`,
        isPresent: st === 'present', isOnline: st === 'online', isAbsent: st === 'absent',
        bPresent: seg(st === 'present', '#0F8A55'), bOnline: seg(st === 'online', '#7C3AED'), bAbsent: seg(st === 'absent', '#E11D48'),
        setPresent: set(i, 'present'), setOnline: set(i, 'online'), setAbsent: set(i, 'absent')
      };
    });
    const total = roster.length;
    const nPresent = students.filter((s) => s.isPresent).length;
    const nOnline = students.filter((s) => s.isOnline).length;
    const nAbsent = students.filter((s) => s.isAbsent).length;
    const pct = (n) => `${(n / total) * 100}%`;
    const chipBase = 'flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;';
    const chips = ['전체', '중1 A', '중1 B', '중2', '중3', '고등 A', '고등 B', '교사'].map((label) => ({
      label,
      style: chipBase + (label === '중1 A' ? `border:0;background:${accent};color:#fff;` : 'border:1px solid #D5DDF0;background:#fff;color:#475467;')
    }));
    const tabBase = 'display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;min-height:44px;box-sizing:border-box;';
    const tab = (label, d, on) => ({ label, d, style: tabBase + `color:${on ? accent : '#5B6678'};` });
    return {
      accent, students, nPresent, nOnline, nAbsent, chips,
      wPresent: pct(nPresent), wOnline: pct(nOnline), wAbsent: pct(nAbsent),
      tabs: [
        tab('홈', 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z', false),
        tab('명단', 'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8', false),
        tab('출석', 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', true),
        tab('심방', 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z', false),
        tab('더보기', 'M4 6h16M4 12h16M4 18h16', false)
      ]
    };
  }
}
</script>
</body>
</html>
